packages:
  - '.'
  - 'web'

allowBuilds:
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - '@nestjs/common@12.6.3'
  - '@nestjs/core@12.6.3'
  - '@nestjs/platform-express@12.6.3'
  - '@nestjs/testing@12.6.3'

permissions:
  '@prisma/client':
    build: true
  '@prisma/engines':
    build: true
  prisma:
    build: true
    skills: true
