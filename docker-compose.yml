services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/linkedin_scheduler?schema=public
      - REDIS_URL=redis://redis:6379
      - ENCRYPTION_MASTER_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - SESSION_SECRET=change-this-to-a-32-plus-char-random-secret-string
      - LINKEDIN_CLIENT_ID=mock_client_id
      - LINKEDIN_CLIENT_SECRET=mock_client_secret
      - LINKEDIN_REDIRECT_URI=http://localhost:3000/api/auth/linkedin/callback
      - LINKEDIN_API_VERSION=202501
      - USE_MOCK_LINKEDIN=true
      - SIMULATE_TRANSIENT_FAILURE=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linkedin_scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
